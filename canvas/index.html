<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FleekDash Dev Canvas</title>
<style>
  :root { color-scheme: dark; --bg:#0b0d12; --panel:#14171f; --border:#262b38; --fg:#e6e9f0; --muted:#8b93a7; --accent:#7c6cf6; }
  html.light { color-scheme: light; --bg:#f4f5f8; --panel:#ffffff; --border:#d9dce4; --fg:#1c2130; --muted:#6b7280; --accent:#5b4be0; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--border); }
  header .brand { font-weight:700; letter-spacing:.4px; }
  header .brand em { color:var(--accent); font-style:normal; }
  header .src { color:var(--muted); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
  header button { background:transparent; color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; font-size:12px; }
  header button:hover { border-color:var(--accent); color:var(--accent); }
  main { flex:1; display:flex; min-height:0; }
  #frame-wrap { flex:1; min-width:0; padding:14px; }
  iframe { width:100%; height:100%; border:1px solid var(--border); border-radius:10px; background:#fff; }
  aside { width:340px; border-left:1px solid var(--border); background:var(--panel); display:flex; flex-direction:column; }
  aside h2 { margin:0; padding:10px 14px; font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); border-bottom:1px solid var(--border); }
  #log { flex:1; overflow-y:auto; padding:8px 0; }
  .log-row { padding:5px 14px; border-bottom:1px solid var(--border); font-size:11.5px; }
  .log-row .t { color:var(--muted); margin-right:8px; }
  .log-row .k { color:var(--accent); margin-right:8px; }
  .log-row pre { margin:4px 0 0; white-space:pre-wrap; word-break:break-word; color:var(--muted); font-size:11px; }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--accent); color:#fff; padding:9px 16px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; font-size:13px; }
  #modal-veil { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; }
  #modal-veil.open { display:flex; }
  #modal { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:20px 24px; max-width:440px; }
  #modal h3 { margin:0 0 8px; }
  #modal iframe { border:0; width:400px; height:280px; border-radius:6px; }
</style>
</head>
<body>
<header>
  <span class="brand">Fleek<em>Dash</em> dev canvas</span>
  <span class="src" id="src-label"></span>
  <button id="theme-btn" type="button">toggle theme</button>
  <button id="reload-btn" type="button">reload ext</button>
</header>
<main>
  <div id="frame-wrap"><iframe id="ext-frame" src="__FD_IFRAME_SRC__"></iframe></div>
  <aside>
    <h2>SDK calls</h2>
    <div id="log"></div>
  </aside>
</main>
<div id="toast"></div>
<div id="modal-veil"><div id="modal"><h3>Mock modal</h3><div id="modal-body"></div><button onclick="document.getElementById('modal-veil').classList.remove('open')" style="margin-top:10px">close</button></div></div>
<script src="/canvas/mock-host.js"></script>
<script>
(async function () {
  const iframe = document.getElementById("ext-frame");
  document.getElementById("src-label").textContent = iframe.getAttribute("src");

  const data = {};
  for (const name of ["site", "posts", "pages", "users", "categories", "settings", "palette", "todo-system"]) {
    try {
      data[name] = await (await fetch("/mock/" + name + ".json")).json();
    } catch { data[name] = name === "settings" ? {} : []; }
  }
  data.paletteVarsCss = (data.palette && data.palette.css) || "";
  // Extension fixtures may hoist custom REST routes / mutation templates:
  // { "mockRoutes": {"/todo-system/v1/bootstrap": {...}}, "mockMutations": {"task": {...}} }
  for (const name of Object.keys(data)) {
    const fixture = data[name];
    if (fixture && typeof fixture === "object") {
      if (fixture.mockRoutes) data.mockRoutes = { ...fixture.mockRoutes, ...data.mockRoutes };
      if (fixture.mockMutations) data.mockMutations = { ...fixture.mockMutations, ...data.mockMutations };
    }
  }

  const logEl = document.getElementById("log");
  const toastEl = document.getElementById("toast");
  let toastTimer = null;

  const host = FDMockHost.createMockHost({
    data,
    onLog({ kind, messageType, detail, at }) {
      const row = document.createElement("div");
      row.className = "log-row";
      row.innerHTML =
        `<span class="t">${at}</span><span class="k">${kind}:${messageType}</span>` +
        (detail ? `<pre></pre>` : "");
      if (detail) row.querySelector("pre").textContent = JSON.stringify(detail, null, 1);
      logEl.prepend(row);
    },
    onNotify({ message, type }) {
      toastEl.textContent = `[${type || "info"}] ${message}`;
      toastEl.style.opacity = "1";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => (toastEl.style.opacity = "0"), 2600);
    },
    onModal(cfg) {
      const body = document.getElementById("modal-body");
      body.innerHTML = "";
      if (cfg.action === "close") {
        document.getElementById("modal-veil").classList.remove("open");
        return;
      }
      const frame = document.createElement("iframe");
      frame.src = cfg.url || "about:blank";
      body.appendChild(frame);
      document.getElementById("modal-veil").classList.add("open");
    },
    onNavigate(path) {
      host.state.lastRoute = path;
    },
  });

  window.addEventListener("message", (e) => host.handleMessage(e));

  document.getElementById("theme-btn").addEventListener("click", () => {
    const dark = !host.state.isDarkMode;
    document.documentElement.classList.toggle("dark", dark);
    document.documentElement.classList.toggle("light", !dark);
    localStorage.setItem("fleekdash-dark-mode", String(dark));
    host.setTheme(iframe, dark);
  });
  document.getElementById("reload-btn").addEventListener("click", () => {
    iframe.contentWindow.location.reload();
  });
})();
</script>
</body>
</html>
